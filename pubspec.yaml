name: doormer
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3
  flutter: 3.27.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc_test: ^9.1.7

  # Dependency Injection
  get_it: ^7.6.4

  # Network
  http: ^1.1.2
  dio: ^5.4.0

  # UI
  font_awesome_flutter: ^10.7.0
  flutter_screenutil: ^5.9.0

  # Routing
  go_router: ^13.2.0

  # Storage
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^1.3.0
  uuid: ^4.2.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.7
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  fonts:
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica.ttf

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - lib/src/features/chat/data/repositories/file/dummydata.json
