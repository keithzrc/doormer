name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Flutter Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Install Dependencies
      run: flutter pub get

    - name: Run Tests
      run: flutter test

  build:
    name: Build Flutter App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml

    - name: Install Dependencies
      run: flutter pub get
    - name: Build Web
      run: flutter build web --release

    # - name: Build APK (Android)
    #   run: flutter build apk --release

    # - name: Build IPA (iOS)
    #   if: runner.os == 'macOS'
    #   run: flutter build ipa --release
